[project]
name = "omarchy-voice"
version = "0.1.0"
description = "Control Omarchy by voice: windows, apps, browsers, herdr agents and dictation"
readme = "README.md"
license = "MIT"
authors = [{ name = "Samy" }]
requires-python = ">=3.12"
dependencies = [
    "faster-whisper>=1.2.1",   # the fast in-process recognizer (base.en)
    "httpx[http2]>=0.28.1",    # Jev decisions over OpenRouter
    "jellyfish>=1.2.1",        # sound-alike matching (Metaphone)
    "numpy>=2.5.3",
    "pillow>=12.3.0",
    "piper-tts>=1.8.0",        # spoken questions and errors
    "playwright>=1.63.0",      # reading and clicking pages over CDP (no browser download needed)
    "rapidfuzz>=3.14.6",
    "sounddevice>=0.5.6",
    "tesserocr>=2.11.0",       # OCR for windows without an accessibility tree
]

[tool.uv]
package = false
